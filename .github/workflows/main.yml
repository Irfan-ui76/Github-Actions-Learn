name: my-first-github-workflow

on: 
   workflow_dispatch:
      
   push:
      branches:
         - master
         - main
         - 'feature/*'
#    pull_request:
#      branches:
#        - main    
   # workflow_dispatch:     
env:
  Deployment_Target: Dev
  App_user: Irfan
  AppPort: 80  
jobs:  
  unit-test:
     name: Unit-test Job
     runs-on: ubuntu-latest
     steps:
        - name: Checkout Code
          uses: actions/checkout@v6.1.0
        - name: Setup Python
          uses: actions/setup-python@v7.0.0 
          with:
             python-version: '3.11'
        - name: Install Dependencies
          run: |
             python -m pip install --upgrade pip
             pip install -r requirements.txt
        - name: Run Unit tests
          run: pytest -v
       
       
